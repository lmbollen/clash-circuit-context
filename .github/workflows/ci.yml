name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check.sh (GHC ${{ matrix.ghc }})
    strategy:
      fail-fast: false
      matrix:
        # Every GHC clash-compiler supports: its packages' `tested-with`, which
        # is also the union of its cabal CI matrices (.ci/ci_recipe.py runs
        # 9.14.1, 9.12.4, 9.10.3 and 9.6.7 on every PR and 9.8.4 nightly). A
        # Clash user can be on any of these, so this package is tested on all
        # of them rather than on a hand-picked subset.
        #
        # Except 9.14.1, for now: the pinned clash-prelude stops at 9.12, and
        # 9.14 also needs hedgehog 1.7 and a ghc-tcplugin-api past 0.19. Add it
        # back once those move.
        ghc: ["9.12.4", "9.10.3", "9.8.4", "9.6.7"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d  # v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          # The newest GHCs need a newer cabal than any fixed pin would stay
          # current with; clash-compiler's CI uses `latest` for the same reason.
          cabal-version: latest

      - name: Version information
        run: |
          ghc --version
          cabal --version

      # The cabal version is in the key because `latest` moves: a store written
      # by one cabal is not one the next can read ("cannot read state cache"),
      # and an exact key hit is never saved over, so without it a stale entry
      # made every run rebuild every dependency until cabal.project changed.
      - name: Cache cabal store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('cabal.project', '*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ steps.setup.outputs.cabal-version }}-

      # Dependencies first, in parallel: with more than one job cabal keeps each
      # package's compiler output in a log and prints it only on failure. Under
      # check.sh's -j1 it would stream third-party warnings into our log (e.g.
      # 120+ -Wderiving-typeable from haskell-src-exts on GHC 9.12).
      - name: Build dependencies
        run: cabal build all --only-dependencies -j

      - name: Build and run checks
        run: ./check.sh
