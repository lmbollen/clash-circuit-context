[package]
name = "surfer-shockwaves"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
camino = "1.2.1"
compile-time = "0.2.0"
# Must track the egui/ecolor that the surfer-translation-types tag below pulls
# from surfer's workspace (0.7.0 -> 0.34.1), or Color32 comes from a SECOND
# ecolor in the graph and ValueKind::Custom(c) fails to typecheck.
egui = { version = "0.34", features = ["serde"] }
either = "1.15.0"
extism-pdk = "1.4.1"
lazy_static = "1.5.0"
num-bigint = "0.4.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
surfer-translation-types = {git="https://gitlab.com/surfer-project/surfer.git", tag="v0.7.0"}
toml = "1.1.0"
